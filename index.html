<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Defensively patch global fetch to ensure it is writable and avoid "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = originalFetch;
          const protoDesc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch') ||
                            Object.getOwnPropertyDescriptor(window, 'fetch');
          if (protoDesc && protoDesc.get && !protoDesc.set) {
            Object.defineProperty(window, 'fetch', {
              get() {
                return currentFetch || (originalFetch ? originalFetch : undefined);
              },
              set(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // silently handle if window is sealed or sandboxed
        }
      })();
    </script>
    <title>Rawsight Autonomous Multi-Chain Vault</title>
    <meta name="description" content="High-frequency quantitative memecoin discovery & sniping terminal with direct WebSocket liquidity pool listeners and 1-click execution across Solana, BNB Chain, and Robinhood Chain with automated Rawsight anti-rug scrutiny." />
